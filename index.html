<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nomofobiómetro | Eureka 2026</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="pantalla-portada">

    <img
      src="imagenes/portada.png"
      alt="Portada del Nomofobiómetro"
      class="imagen-portada"
    >

<button
  class="zona-comenzar"
  aria-label="Comenzar el Nomofobiómetro"
  onclick="mostrarPregunta1()"
></button>
  
<svg
  id="zonasP1"
  class="zonas-pregunta"
  viewBox="0 0 390 744"
  preserveAspectRatio="none"
  style="display:none;"
>
<rect class="zona-prueba" x="103" y="392" width="190" height="24"
      onclick="responderP1(1)"></rect>

<rect class="zona-prueba" x="103" y="432" width="190" height="24"
      onclick="responderP1(2)"></rect>

<rect class="zona-prueba" x="103" y="472" width="190" height="24"
      onclick="responderP1(3)"></rect>

<rect class="zona-prueba" x="103" y="512" width="190" height="24"
      onclick="responderP1(4)"></rect>

<rect class="zona-prueba" x="103" y="552" width="190" height="24"
      onclick="responderP1(5)"></rect>
</svg> 
  </main>

<script>
  let puntajeTotal = 0;

  function mostrarPregunta1() {
    document.querySelector(".imagen-portada").src = "imagenes/pregunta1.png";
    document.querySelector(".zona-comenzar").style.display = "none";
    document.querySelector("#zonasP1").style.display = "block";
  }

  function responderP1(valor) {
    puntajeTotal += valor;

    console.log("Respuesta P1:", valor);
    console.log("Puntaje total:", puntajeTotal);
   
  }
</script>

</body>
</html>
