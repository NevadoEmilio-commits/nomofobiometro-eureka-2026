<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nomofobiómetro | Eureka 2026</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="pantalla-portada">

    <img
      src="imagenes/portada.png"
      alt="Portada del Nomofobiómetro"
      class="imagen-portada"
    >

<button
  class="zona-comenzar"
  aria-label="Comenzar el Nomofobiómetro"
  onclick="mostrarPregunta1()"
></button>
  
<svg
  id="zonasP1"
  class="zonas-pregunta"
  viewBox="0 0 390 744"
  preserveAspectRatio="none"
  style="display:none;"
>
<rect class="zona-prueba" x="103" y="392" width="190" height="24"
      onclick="responderP1(1)"></rect>

<rect class="zona-prueba" x="103" y="432" width="190" height="24"
      onclick="responderP1(2)"></rect>

<rect class="zona-prueba" x="103" y="472" width="190" height="24"
      onclick="responderP1(3)"></rect>

<rect class="zona-prueba" x="103" y="512" width="190" height="24"
      onclick="responderP1(4)"></rect>

<rect class="zona-prueba" x="103" y="552" width="190" height="24"
      onclick="responderP1(5)"></rect>

<rect class="zona-siguiente"
      x="105" y="610"
      width="180" height="42"
      onclick="siguienteP1()">
</rect>
<rect class="zona-continuar"
      x="88" y="622"
      width="220" height="50"
      onclick="mostrarCierre()">
</rect>
  <rect class="zona-video"
      x="82" y="500"
      width="226" height="55"
      onclick="abrirVideo()">
</rect>

<rect class="zona-inicio"
      x="82" y="570"
      width="226" height="55"
      onclick="volverInicio()">
</rect>
</svg> 
  </main>

<script>
  let puntajeTotal = 0;
let respuestaP1 = null;
 let preguntaActual = 2;
let respuestas = {};
  function mostrarPregunta1() {
    document.querySelector(".imagen-portada").src = "imagenes/pregunta1.png";
    document.querySelector(".zona-comenzar").style.display = "none";
    document.querySelector("#zonasP1").style.display = "block";
  }

  function responderP1(valor) {
  respuestaP1 = valor;

  console.log("Respuesta P1:", respuestaP1);
}

function siguienteP1() {
  if (respuestaP1 === null) {
    alert("Selecciona una respuesta antes de continuar.");
    return;
  }
respuestas[1] = respuestaP1;
  document.querySelector(".imagen-portada").src = "imagenes/pregunta2.png";

  document.querySelector("#zonasP1").style.display = "block";

  document.querySelectorAll("#zonasP1 .zona-prueba").forEach((zona, indice) => {
    zona.setAttribute("onclick", `responderPregunta(${indice + 1})`);
  });

  document.querySelector(".zona-siguiente")
    .setAttribute("onclick", "siguientePregunta()");
}
function responderPregunta(valor) {
  respuestas[preguntaActual] = valor;

  console.log(
    "Respuesta P" + preguntaActual + ":",
    respuestas[preguntaActual]
  );
}

function siguientePregunta() {
  if (respuestas[preguntaActual] == null) {
    alert("Selecciona una respuesta antes de continuar.");
    return;
  }

  console.log(
    "P" + preguntaActual + " guardada:",
    respuestas[preguntaActual]
  );

 if (preguntaActual < 12) {
  preguntaActual++;

  document.querySelector(".imagen-portada").src =
    "imagenes/pregunta" + preguntaActual + ".png";

} else {

  document.querySelector(".imagen-portada").src =
    "imagenes/analizando.png";

  document.querySelector("#zonasP1").style.display = "none";

  setTimeout(() => {
    mostrarResultado();
  }, 3000);
}
}
function mostrarResultado() {
  let total = 0;

  // Preguntas 1 a 11
  for (let i = 1; i <= 11; i++) {
    total += respuestas[i];
  }

  // Pregunta 12: puntuación invertida
  total += 6 - respuestas[12];

  console.log("Puntaje final:", total);

  let imagenResultado = "";

  if (total <= 19) {
    imagenResultado = "imagenes/resultado-verde.png";
  } else if (total <= 27) {
    imagenResultado = "imagenes/resultado-amarillo.png";
  } else if (total <= 43) {
    imagenResultado = "imagenes/resultado-naranja.png";
  } else {
    imagenResultado = "imagenes/resultado-rojo.png";
  }

  document.querySelector(".imagen-portada").src = imagenResultado;
  
  document.querySelector("#zonasP1").style.display = "block";
  document.querySelector(".zona-siguiente").style.display = "none";
document.querySelector(".zona-continuar").style.pointerEvents = "all";
 }
  function mostrarCierre() {
  document.querySelector(".imagen-portada").src = "imagenes/cierre.png";

  document.querySelector("#zonasP1").style.display = "block";

  document.querySelectorAll("#zonasP1 .zona-prueba")
    .forEach(zona => zona.style.display = "none");

  document.querySelector(".zona-siguiente")
    .style.display = "none";
    document.querySelector(".zona-continuar").style.pointerEvents = "none";
    document.querySelector(".zona-video").style.pointerEvents = "all";
document.querySelector(".zona-inicio").style.pointerEvents = "all";
}
  function abrirVideo() {
  window.open("https://youtu.be/cFzMe4WCJn4", "_blank");
}

function volverInicio() {
  location.reload();
}
</script>

</body>
</html>
